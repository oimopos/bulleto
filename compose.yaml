services:
  tracker:
    build: .
    container_name: buleto-roulette-tracker
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_PATH: /app/data/buleto.sqlite
      BULETO_WS_URL: wss://buleto.com/ws
      BULETO_INSTRUMENT: XPM/RUB
      COLLECTOR_ENABLED: "true"
      GAP_THRESHOLD_SECONDS: 135
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - tracker-data:/app/data

volumes:
  tracker-data:
