<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090c0f">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Текущее состояние виртуального автотеста">
    <title>Состояние автотеста</title>
    <link rel="stylesheet" href="/styles.css?v=17">
    <script type="module" src="/app.js?v=17"></script>
  </head>
  <body>
    <main class="autotest-page">
      <section
        class="autotest-card"
        id="autotest-card"
        data-state="loading"
        aria-labelledby="autotest-heading autotest-status-title"
        aria-describedby="autotest-status-copy"
        aria-busy="true"
      >
        <p class="autotest-card__heading" id="autotest-heading">Состояние автотеста</p>
        <h1 class="autotest-card__status" id="autotest-status-title">Получаем состояние…</h1>
        <p
          class="autotest-card__copy"
          id="autotest-status-copy"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        >Ожидаем данные.</p>
      </section>
    </main>
  </body>
</html>
