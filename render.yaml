services:
  - type: web
    name: buleto-roulette-tracker
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: commit
    healthCheckPath: /api/live
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: buleto-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /app/data/buleto.sqlite
      - key: DATABASE_SEED_PATH
        value: /app/seed/buleto.sqlite
      - key: BULETO_WS_URL
        value: wss://buleto.com/ws
      - key: BULETO_INSTRUMENT
        value: XPM/RUB
      - key: COLLECTOR_ENABLED
        value: "true"
      - key: VIRTUAL_STARTING_BALANCE
        value: "87700"
      - key: GAP_THRESHOLD_SECONDS
        value: "135"
      - key: RECONNECT_MIN_MS
        value: "1000"
      - key: RECONNECT_MAX_MS
        value: "30000"
      - key: STALE_AFTER_MS
        value: "180000"
